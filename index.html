<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cellforge</title>
  <meta name="description" content="Cellforge 공식 웹사이트" />
  <style>
    :root {
      --bg: #000000;
      --fg: #f5f5f7;
      --muted: #86868b;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Pretendard", "Apple SD Gothic Neo", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-align: center;
      padding: 2rem;
    }
    h1 {
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 1rem;
      background: linear-gradient(180deg, #ffffff 0%, #a1a1a6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      font-size: clamp(1rem, 2vw, 1.25rem);
      color: var(--muted);
      letter-spacing: -0.01em;
    }
  </style>
</head>
<body>
  <main>
    <h1>Cellforge</h1>
    <p>Official Website Coming Soon</p>
  </main>
</body>
</html>
